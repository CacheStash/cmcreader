<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZenReader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                900: '#111111',
                800: '#1a1a1a',
                700: '#2a2a2a',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000;
        color: #e5e5e5;
        overscroll-behavior: none;
      }
      /* Hide scrollbar for clean reading */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.31.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@^5.4.624",
    "dexie": "https://esm.sh/dexie@^4.3.0",
    "jszip": "https://esm.sh/jszip@^3.10.1",
    "react-icons/": "https://esm.sh/react-icons@^5.5.0/",
    "dexie-react-hooks": "https://esm.sh/dexie-react-hooks@^4.2.0",
    "node-unrar-js": "https://esm.sh/node-unrar-js@2.0.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
